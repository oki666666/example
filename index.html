<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 Todo アプリ</h1>

        <div class="input-section">
            <input type="text" id="todoInput" placeholder="新しいタスクを入力..." />
            <button id="addBtn">追加</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">すべて</button>
            <button class="filter-btn" data-filter="active">未完了</button>
            <button class="filter-btn" data-filter="completed">完了済み</button>
        </div>

        <section class="voice-section">
            <h2>🔊 VOICEVOX 読み上げ</h2>
            <div class="voice-grid">
                <label class="voice-label">
                    <span>Engine URL</span>
                    <input type="text" id="voicevoxBaseUrl" value="http://127.0.0.1:50021" />
                </label>
                <label class="voice-label">
                    <span>話者</span>
                    <select id="speakerSelect"></select>
                </label>
            </div>
            <div class="voice-options">
                <label class="toggle-option">
                    <input type="checkbox" id="speakOnAdd" />
                    <span>タスク追加時に自動読み上げ</span>
                </label>
                <label class="toggle-option">
                    <input type="checkbox" id="beepOnComplete" checked />
                    <span>タスク完了時に効果音</span>
                </label>
            </div>
            <div class="voice-actions">
                <button id="loadSpeakersBtn">話者一覧を更新</button>
                <button id="speakActiveBtn">未完了タスクを読む</button>
                <span id="voiceStatus" class="voice-status" aria-live="polite">未接続</span>
            </div>
        </section>

        <ul id="todoList" class="todo-list"></ul>

        <div class="stats">
            <span id="todoCount">0 個のタスク</span>
            <button id="clearCompleted">完了済みを削除</button>
        </div>
    </div>

    <script src="voicevox.js"></script>
    <script src="script.js"></script>
</body>
</html>
