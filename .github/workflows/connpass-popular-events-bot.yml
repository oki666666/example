name: connpass popular events bot

on:
  schedule:
    # Every Wednesday 10:00 JST = Wednesday 01:00 UTC
    - cron: "0 1 * * 3"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Post to Slack without sending (true/false)"
        required: false
        default: "false"

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bot/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: bot

      - name: Run connpass notifier
        run: npm run connpass:notify
        working-directory: bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: "#times-oki"
          MIN_ACCEPTED: "300"
          CONNPASS_MAX_PAGES: "20"
          CONNPASS_COUNT_PER_PAGE: "100"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
